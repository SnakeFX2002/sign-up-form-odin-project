<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css">
    <title>sign-up-form</title>
  </head>
  <body>
    <main class="main-container">
      
      <!-- 1. SECȚIUNEA DIN STÂNGA (Rămâne neschimbată) -->
      <section class="left-section">
        <div class="logo-container">
          <img src="assetts/logo.png" alt="odin">
          <span class="logo-text">ODIN</span>
        </div>
      </section>

      <!-- 2. SECȚIUNEA DIN DREAPTA (Deschidem aici) -->
      <section class="right-section">
        
        <header class="hero-text">
          <div class="hero-content">
            <p>
              This is not a real online service! You know you need something <br> like this in your life to help you realize your deepest dreams. <br>
              Sign up <em>now</em> to get started.
            </p>
            <p class="call-to-action">You <em>know</em> you want to.</p>
          </div>
        </header>

        <!-- Formularul intră ACUM înăuntrul secțiunii din dreapta -->
        <form action="#" method="post" class="sign-up-form">
          <h2>Let's do this!</h2>

          <div class="form-row">
            <div class="input-group">
              <label for="first-name">First Name</label>
              <input type="text" id="first-name" name="first-name" required>
            </div>
            <div class="input-group">
              <label for="last-name">Last Name</label>
              <input type="text" id="last-name" name="last-name" required>
            </div>
            <div class="input-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required>
            </div>
            <div class="input-group">
              <label for="phone-number">Phone Number</label>
              <input type="tel" id="phone-number" name="phone-number" required>
            </div>
            <div class="input-group">
              <!-- CORECTAT: for="password" în loc de first-name -->
              <label for="password">Password</label>
              <input type="password" id="password" name="password" required>
            </div>
            <div class="input-group">
              <label for="confirm-password">Confirm Password</label>
              <input type="password" id="confirm-password" name="confirm-password" required>
            </div>
          </div>

          <div class="button-zone">
            <button type="submit">Create Account</button>
            <p>Already have an account? <a href="">Log in</a></p>
          </div>
        </form>

      </section> <!-- AICI se închide corect secțiunea din dreapta! -->

    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
